name: Deploy to Netcup

# Löst nach jedem Merge auf main das Deployment auf dem Netcup-Server aus.
# Gebaut wird nicht hier: der Server holt sich den Stand selbst per git.
# Dieser Workflow stößt ihn nur an. Einrichtung siehe deploy/README.md.
#
# Sind die Secrets noch nicht hinterlegt, wird übersprungen statt zu scheitern.
# Ein rotes Kreuz soll heißen "das Deployment ist kaputt", nicht "du hast es
# noch nicht eingerichtet" — sonst schaut irgendwann niemand mehr hin.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Zwei Deployments gleichzeitig würden sich im selben Verzeichnis begegnen.
concurrency:
  group: deploy-netcup
  cancel-in-progress: false

jobs:
  # Eigener Job, weil der secrets-Kontext in einer job-weiten if-Bedingung
  # nicht zur Verfügung steht. Über ein Output geht es.
  vorpruefung:
    runs-on: ubuntu-latest
    outputs:
      bereit: ${{ steps.pruefen.outputs.bereit }}
    steps:
      - id: pruefen
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          SSH_HOST: ${{ secrets.NETCUP_HOST }}
          SSH_USER: ${{ secrets.NETCUP_USER }}
          REMOTE_PATH: ${{ secrets.NETCUP_PATH }}
          KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
        run: |
          fehlend=""
          [ -n "$SSH_KEY" ]     || fehlend="$fehlend NETCUP_SSH_KEY"
          [ -n "$SSH_HOST" ]    || fehlend="$fehlend NETCUP_HOST"
          [ -n "$SSH_USER" ]    || fehlend="$fehlend NETCUP_USER"
          [ -n "$REMOTE_PATH" ] || fehlend="$fehlend NETCUP_PATH"
          [ -n "$KNOWN_HOSTS" ] || fehlend="$fehlend NETCUP_KNOWN_HOSTS"

          if [ -z "$fehlend" ]; then
            echo "bereit=true" >> "$GITHUB_OUTPUT"
            echo "Alle Zugangsdaten vorhanden." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Alles fehlt: das Deployment ist schlicht noch nicht eingerichtet.
          gesamt=5
          anzahl=$(printf '%s' "$fehlend" | wc -w)
          echo "bereit=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployment übersprungen"
            echo
            if [ "$anzahl" -eq "$gesamt" ]; then
              echo "Es ist noch nichts eingerichtet. Anleitung: \`deploy/README.md\`."
            else
              echo "Teilweise eingerichtet — es fehlen noch:"
              echo
              for s in $fehlend; do echo "- \`$s\`"; done
            fi
            echo
            echo "Anzulegen unter **Settings › Secrets and variables › Actions**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deployment übersprungen::Fehlende Secrets:$fehlend"

  deploy:
    needs: vorpruefung
    if: needs.vorpruefung.outputs.bereit == 'true'
    runs-on: ubuntu-latest
    # Optional: unter Settings › Environments lässt sich hier eine Freigabe
    # oder eine IP-Beschränkung hinterlegen.
    environment: production

    steps:
      - name: SSH einrichten
        env:
          SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NETCUP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Der Schlüssel wird über die Umgebung übergeben, nicht als Argument:
          # Argumente stehen in der Prozessliste, Umgebungsvariablen nicht.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Fingerabdruck aus den Secrets statt StrictHostKeyChecking=no.
          # Ohne das wäre die Verbindung gegen einen untergeschobenen Host offen.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deployment auslösen
        env:
          SSH_HOST: ${{ secrets.NETCUP_HOST }}
          SSH_USER: ${{ secrets.NETCUP_USER }}
          REMOTE_PATH: ${{ secrets.NETCUP_PATH }}
          SSH_PORT: ${{ vars.NETCUP_SSH_PORT }}
          DEPLOY_BRANCH: ${{ vars.NETCUP_DEPLOY_BRANCH }}
          RELOAD_CMD: ${{ vars.NETCUP_RELOAD_CMD }}
          HEALTH_URL: ${{ vars.NETCUP_HEALTH_URL }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy \
              -p "${SSH_PORT:-22}" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              "$SSH_USER@$SSH_HOST" \
              "DEPLOY_BRANCH='${DEPLOY_BRANCH:-main}' \
               RELOAD_CMD='${RELOAD_CMD:-}' \
               HEALTH_URL='${HEALTH_URL:-}' \
               bash -lc 'cd \"$REMOTE_PATH\" && bash ./deploy/deploy.sh'"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts
